
name: Build HR Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Extract source
        run: unzip -q HR-Plugin-Source.zip

      - name: Build plugin
        run: |
          cd HR-Plugin
          mvn --batch-mode package

      - uses: actions/upload-artifact@v4
        with:
          name: HR-Plugin-JAR
          path: HR-Plugin/target/*.jar
