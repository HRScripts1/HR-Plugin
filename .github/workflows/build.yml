
name: Build HR Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q HR-Plugin-Source.zip

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugin
        run: |
          cd HR-Plugin
          mvn --batch-mode package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HR-Plugin-JAR
          path: HR-Plugin/target/*.jar

